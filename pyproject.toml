[project]
name = "ha-dispatcharr"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "aiohttp>=3.10",
  "homeassistant>=2026.8.0",
  "pytest>=9,<10",
  "pytest-asyncio>=0.24",
  "pytest-homeassistant-custom-component>=0.13.300",
  "ruff>=0.9",
]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".venv"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM"]
ignore = ["S101"]
